<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #c { width: 100vw; height: 100vh; display: block; }
  #err {
    position: fixed; left: 8px; right: 8px; bottom: 8px;
    font: 12px -apple-system, sans-serif; color: #c0392b;
    background: rgba(255,255,255,0.88); border-radius: 8px; padding: 8px;
    display: none; white-space: pre-wrap;
  }
</style>
<!-- three.js / three-vrm は実行時にCDN(esm.sh)から読み込む。
     esm.sh が bare specifier(three 等)の依存解決を自動で行う。 -->
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/loaders/GLTFLoader.js": "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
    "@pixiv/three-vrm": "https://esm.sh/@pixiv/three-vrm@3.5.5?deps=three@0.160.0"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<script type="module">
const errEl = document.getElementById('err');
function showErr(message) {
  errEl.style.display = 'block';
  errEl.textContent = 'VRM表示エラー:\n' + message + '\n(ネット接続と .vrm ファイルを確認してね)';
}
window.addEventListener('error', (e) => showErr(e.message || String(e.error || e)));
window.addEventListener('unhandledrejection', (e) => showErr(String(e.reason)));

try {
  const THREE = await import('three');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const { VRMLoaderPlugin, VRMUtils } = await import('@pixiv/three-vrm');

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setClearColor(0x000000, 0); // 透過
  renderer.setPixelRatio(window.devicePixelRatio || 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    30, window.innerWidth / Math.max(1, window.innerHeight), 0.1, 100
  );
  camera.position.set(0, 1.3, -1.6);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.2));
  const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
  keyLight.position.set(1, 2, -2);
  scene.add(keyLight);

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  let currentVRM = null;      // VRM拡張がある場合のみ
  let displayObject = null;   // 表示中のオブジェクト(VRM/素のglTF共通)
  let mixer = null;           // 素のglTFにアニメーションがある場合
  const clock = new THREE.Clock();

  const loader = new GLTFLoader();
  loader.register((parser) => new VRMLoaderPlugin(parser));

  function onLoadError(e) {
    showErr('モデル読み込み失敗: ' + (e && e.message ? e.message : e));
  }

  // モデルのバイト列は Swift 側から直接受け取り、fetch を使わず parse する。
  // (WKWebView は file:// / custom scheme への fetch を弾くことがあるため、
  //  fetch を完全に排除してこの問題を回避する)
  function handleGltf(gltf) {
      const vrm = gltf.userData.vrm;

      if (vrm) {
        // VRM拡張あり(.vrm、またはVRM拡張入りの.glb)
        currentVRM = vrm;
        displayObject = vrm.scene;
        try { VRMUtils.removeUnnecessaryVertices?.(gltf.scene); } catch (_) {}
        try { VRMUtils.combineSkeletons?.(gltf.scene); } catch (_) {}
        scene.add(vrm.scene);
        // 既定はTポーズ(腕が真横)なので、両腕を下ろして自然な立ち姿にする。
        if (vrm.humanoid) {
          const la = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
          const ra = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
          const a = THREE.MathUtils.degToRad(72);
          if (la) { la.rotation.z = a; }
          if (ra) { ra.rotation.z = -a; }
        }
        if (vrm.update) { vrm.update(0); }
      } else {
        // VRM拡張なしの素の glTF / GLB。3Dモデルとして表示する。
        displayObject = gltf.scene;
        scene.add(displayObject);
        if (gltf.animations && gltf.animations.length) {
          mixer = new THREE.AnimationMixer(displayObject);
          gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
        }
      }

      // 正面をカメラに向ける(180°回転 + カメラを +Z 側に置く)。
      // ヘッドレスChromiumでの実描画検証でこの向き・距離を確定済み。
      displayObject.rotation.y = Math.PI;
      displayObject.updateWorldMatrix(true, true);

      // 全身が収まるようにカメラを自動調整(モデルの寸法から算出)
      const box = new THREE.Box3().setFromObject(displayObject);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const dist = size.y * 1.95 + 0.4;
      camera.position.set(center.x, center.y, dist);
      camera.lookAt(center.x, center.y, center.z);
  }

  // Swift から base64 でモデルのバイト列を受け取り、ArrayBuffer にして parse。
  try {
    const b64 = await window.webkit.messageHandlers.model.postMessage('get');
    if (!b64) { throw new Error('モデルデータが空です'); }
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
    loader.parse(bytes.buffer, '', handleGltf, onLoadError);
  } catch (e) {
    showErr('モデル取得エラー: ' + (e && e.message ? e.message : e));
  }

  // まばたき用タイマー
  let blinkTimer = 0;
  let nextBlink = 2 + Math.random() * 3;
  let blinking = false;

  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    if (currentVRM) {
      const em = currentVRM.expressionManager;
      if (em) {
        blinkTimer += dt;
        if (!blinking && blinkTimer > nextBlink) {
          blinking = true;
          em.setValue('blink', 1.0);
        } else if (blinking && blinkTimer > nextBlink + 0.12) {
          blinking = false;
          em.setValue('blink', 0.0);
          blinkTimer = 0;
          nextBlink = 2 + Math.random() * 3;
        }
      }
      currentVRM.update(dt);
    }

    // 素のglTFにアニメーションがあれば再生
    if (mixer) { mixer.update(dt); }

    // ゆるやかな呼吸のような上下動(VRM/素モデル共通)
    if (displayObject) {
      displayObject.position.y = Math.sin(performance.now() / 1400) * 0.01;
    }

    renderer.render(scene, camera);
  }
  animate();
} catch (e) {
  showErr(String(e && e.message ? e.message : e));
}
</script>
</body>
</html>
