<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #c { width: 100vw; height: 100vh; display: block; }
  #err {
    position: fixed; left: 8px; right: 8px; bottom: 8px;
    font: 12px -apple-system, sans-serif; color: #c0392b;
    background: rgba(255,255,255,0.88); border-radius: 8px; padding: 8px;
    display: none; white-space: pre-wrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>

<!-- 3Dライブラリ(three.js + @pixiv/three-vrm)と描画ロジックを同梱。
     中身は Swift 側が bundle.js を読み込んで差し込む。CDN・サブリソース読込なし。 -->
<script>
//__VRM_BUNDLE__
</script>

<!-- モデルのバイト列(base64)も Swift 側がここに差し込む。fetch もメッセージ
     ハンドラも使わず、全てを1つのHTMLに含める(唯一使う仕組みは、動作実績のある
     「スキームハンドラがこのHTMLを配信する」ことだけ)。 -->
<script>window.__MODEL_B64__ = "__MODEL_B64_TOKEN__";</script>

<script>
  window.__startVRM__(async function () {
    const b64 = window.__MODEL_B64__ || '';
    if (!b64) { throw new Error('モデルが設定されていません'); }
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
    return bytes.buffer;
  });
</script>
</body>
</html>
