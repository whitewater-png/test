<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #c { width: 100vw; height: 100vh; display: block; }
  #err {
    position: fixed; left: 8px; right: 8px; bottom: 8px;
    font: 12px -apple-system, sans-serif; color: #c0392b;
    background: rgba(255,255,255,0.88); border-radius: 8px; padding: 8px;
    display: none; white-space: pre-wrap;
  }
</style>
<!-- three.js / three-vrm は実行時にCDN(esm.sh)から読み込む。
     esm.sh が bare specifier(three 等)の依存解決を自動で行う。 -->
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/loaders/GLTFLoader.js": "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
    "@pixiv/three-vrm": "https://esm.sh/@pixiv/three-vrm@3.5.5?deps=three@0.160.0"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<script type="module">
const errEl = document.getElementById('err');
function showErr(message) {
  errEl.style.display = 'block';
  errEl.textContent = 'VRM表示エラー:\n' + message + '\n(ネット接続と .vrm ファイルを確認してね)';
}
window.addEventListener('error', (e) => showErr(e.message || String(e.error || e)));
window.addEventListener('unhandledrejection', (e) => showErr(String(e.reason)));

try {
  const THREE = await import('three');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const { VRMLoaderPlugin, VRMUtils } = await import('@pixiv/three-vrm');

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setClearColor(0x000000, 0); // 透過
  renderer.setPixelRatio(window.devicePixelRatio || 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    30, window.innerWidth / Math.max(1, window.innerHeight), 0.1, 100
  );
  camera.position.set(0, 1.3, -1.6);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.2));
  const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
  keyLight.position.set(1, 2, -2);
  scene.add(keyLight);

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  let currentVRM = null;
  const clock = new THREE.Clock();

  const loader = new GLTFLoader();
  loader.register((parser) => new VRMLoaderPlugin(parser));

  loader.load(
    './model.vrm',
    (gltf) => {
      const vrm = gltf.userData.vrm;
      currentVRM = vrm;
      try { VRMUtils.removeUnnecessaryVertices?.(gltf.scene); } catch (_) {}
      try { VRMUtils.combineSkeletons?.(gltf.scene); } catch (_) {}

      // VRM0 は VRM1 と正面の向きが逆。-Z 向きに正規化してからカメラを -Z 側に置く。
      const isVRM0 = !!(vrm.meta && (vrm.meta.metaVersion === '0' || vrm.meta.metaVersion === 0));
      scene.add(vrm.scene);
      if (isVRM0) { try { VRMUtils.rotateVRM0?.(vrm); } catch (_) {} }
      vrm.scene.updateWorldMatrix(true, true);

      // 顔〜上半身が収まるようにカメラを自動調整(モデルの寸法から算出)
      const box = new THREE.Box3().setFromObject(vrm.scene);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const lookY = box.max.y - size.y * 0.16;
      const dist = size.y * 0.9 + 0.4;
      camera.position.set(center.x, lookY, -dist);
      camera.lookAt(center.x, lookY, center.z);
    },
    undefined,
    (e) => showErr('モデル読み込み失敗: ' + (e && e.message ? e.message : e))
  );

  // まばたき用タイマー
  let blinkTimer = 0;
  let nextBlink = 2 + Math.random() * 3;
  let blinking = false;

  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    if (currentVRM) {
      const em = currentVRM.expressionManager;
      if (em) {
        blinkTimer += dt;
        if (!blinking && blinkTimer > nextBlink) {
          blinking = true;
          em.setValue('blink', 1.0);
        } else if (blinking && blinkTimer > nextBlink + 0.12) {
          blinking = false;
          em.setValue('blink', 0.0);
          blinkTimer = 0;
          nextBlink = 2 + Math.random() * 3;
        }
      }
      // ゆるやかな呼吸のような上下動
      currentVRM.scene.position.y = Math.sin(performance.now() / 1400) * 0.01;
      currentVRM.update(dt);
    }

    renderer.render(scene, camera);
  }
  animate();
} catch (e) {
  showErr(String(e && e.message ? e.message : e));
}
</script>
</body>
</html>
